baseURL = "https://hyegyeongseo.github.io/"
languageCode = "ko"
title = "기록 블로그"
theme = "PaperMod"
[pagination]
  pagerSize = 10

timezone = "Asia/Seoul"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "서비스를 만들고(Software Engineering) · 운영 가능하게 만들고(Infra & Observability) · 문제 해결로 증명하는(Troubleshooting) 기록"
  author = "hyegyeongseo"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowLastMod = true
  TocOpen = true

  [params.homeInfoParams]
    Title = "기록 블로그"
    Content = "서비스를 설계하고, 운영하고, 운영 중 드러난 문제를 분석하고 해결한 기록입니다."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/hyegyeongseo"

[menus]
  [[menus.main]]
    name = "Software Engineering"
    url = "/categories/software-engineering/"
    weight = 20
  [[menus.main]]
    name = "Infra & Observability"
    url = "/categories/infra-observability/"
    weight = 30
  [[menus.main]]
    name = "Troubleshooting"
    url = "/categories/troubleshooting/"
    weight = 40
  [[menus.main]]
    name = "Tags"
    url = "/tags/"
    weight = 50

[markup]
  [markup.highlight]
    # noClasses=false → chroma renders class names (.k, .nf, .s, ...) instead of inline styles,
    # so the syntax theme can be controlled from custom.css and switch between light/dark.
    noClasses = false
    # style is still used as a fallback for the few classes we don't override.
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = false